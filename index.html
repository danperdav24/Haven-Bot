<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Haven Bot — Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: url("https://cdn.discordapp.com/attachments/1506139097956356116/1507070263341220062/copy_2CFD341E-9D5C-4806-ADB5-7109409CE119-ezgif.com-video-to-gif-converter.gif?ex=6a1138ce&is=6a0fe74e&hm=5ae18120c6eaff16cab640d0f8e0af2b87ca7d6037edf894153cbf3b8b111660&") no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(0, 0, 0, 0.65);
            padding: 40px;
            border-radius: 12px;
            width: 450px;
            text-align: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #5865F2;
        }

        p {
            font-size: 18px;
            color: #dcdcdc;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Welcome to Haven Bot</h1>
    <p>Your all‑in‑one Discord bot created and developed by Dan.</p>

    <a class="btn" href="credits.html">View Credits</a>
</div>

</body>
</html>
